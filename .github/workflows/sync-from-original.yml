name: Sync from original catalog (read-only)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-original-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout revision repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Git LFS
        run: git lfs install

      - name: Sync live catalog from original
        env:
          ORIGINAL_REPO_URL: https://github.com/printitbcn/cat-logo-2026-.git
          ORIGINAL_BRANCH: redesign-home
        run: node scripts/sync-from-original.mjs

      - name: Commit catalog only
        run: |
          git config user.name "printit-revision-bot"
          git config user.email "revision-bot@printitbcn.com"
          # Solo el catálogo y su metadato. Notas y capa de revisión no se tocan.
          git add -- catalog INFORME_ASSETS.md .sync-meta.json
          if git diff --cached --quiet; then
            echo "No catalog changes"
            exit 0
          fi
          unexpected=$(git diff --cached --name-only | grep -Ev '^(catalog/|INFORME_ASSETS.md|\.sync-meta.json$)' || true)
          if [ -n "$unexpected" ]; then
            echo "El sync intentó cambiar archivos que no son del catálogo:"
            echo "$unexpected"
            exit 1
          fi
          git commit -m "Sync live catalog from original $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
